{% extends "base.html" %}
{% load static %}
{% block title %}Login{% endblock title %}
{% block style %}
<link rel="stylesheet" href="{% static 'css/login-style.css' %}">
{% endblock style %}
{% block content %}
<div class="login-container">
  <h2 class="login-title">Welcome Back</h2>
  
  <form class="login-form">
    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" name="usernameemail" id="username" placeholder="Enter your username or email" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="login-btn">Login</button>
  </form>

  <p class="redirect-text">
    New user? <a href="signup.html">Create an account</a>
  </p>

  <!-- Google Login Block -->
  <div class="google-login">
  <a href="/auth/google" class="google-btn" style="text-decoration: none;">
    <img src="{% static "images/google-logo.png" %}" alt="Google Logo" class="google-icon">
    Login with Google
  </a>
</div>
</div>
{% endblock content %}
