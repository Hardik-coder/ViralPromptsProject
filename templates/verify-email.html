<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verify Your Email</title>
</head>
<body style="margin:0; padding:0; background-color:#0f172a; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f172a; padding:40px 0;">
    <tr>
      <td align="center">
        <!-- Card -->
        <table width="500" cellpadding="0" cellspacing="0" style="background-color:#1e293b; border-radius:12px; box-shadow:0 0 25px rgba(124,124,255,0.4);">
          <tr>
            <td style="padding:30px; text-align:center; color:#ffffff;">
              
              <!-- Title -->
              <h2 style="margin:0; font-size:22px; font-weight:700; background:linear-gradient(135deg,#7c7cff,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
                Verify Your Email
              </h2>
              
              <!-- Message -->
              <p style="margin:20px 0; font-size:16px; color:#cbd5f5;">
                🎉 Thanks for signing up! Please confirm your email address by clicking the button below.
              </p>
              
              <!-- Button -->
              <a href="{{ verify_link }}" 
                 style="display:inline-block; padding:12px 24px; background:linear-gradient(135deg,#7c7cff,#38bdf8); color:#ffffff; text-decoration:none; font-weight:600; border-radius:8px; box-shadow:0 0 12px rgba(124,124,255,0.6);">
                Verify Email
              </a>
              
              <!-- Subtext -->
              <p style="margin-top:25px; font-size:14px; color:#94a3b8;">
                If you didn’t create this account, you can safely ignore this email.
              </p>
              
              <!-- Footer -->
              <p style="margin-top:30px; font-size:12px; color:#64748b;">
                © 2026 ViralPrompts. All rights reserved.
              </p>
              
            </td>
          </tr>
        </table>
        <!-- End Card -->
      </td>
    </tr>
  </table>

</body>
</html>
