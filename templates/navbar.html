<header>
  <nav class="navbar">
    <div class="navbar-brand"><a href="{% url "home" %}" style="text-decoration: none;">ViralPrompts</a></div>

    <!-- Hamburger toggle (mobile only) -->
    <div class="navbar-toggle" id="navbar-toggle">&#9776;</div>

    <!-- Desktop nav links -->
    <ul class="navbar-menu">
      {% if user.is_authenticated %}
        <li><a href="{% url "dashboard" %}">Dashboard</a></li>
        <li><a href="{% url "contact" %}">Contact</a></li>
        <li><a href="{% url "logout" %}">Logout</a></li>
      {% else %}
        
        <li><a href="{% url "contact" %}">Contact</a></li>
        <li><a href="{% url "login" %}">Login</a></li>
      {% endif %}
    </ul>
  </nav>
</header>

<!-- Mobile card menu (separate from header, sits below navbar) -->
<div class="navbar-card" id="navbar-card">
  
  <ul class="navbar-card-menu">
    {% if user.is_authenticated %}
        <li><a href="{% url "dashboard" %}">Dashboard</a></li>
        <li><a href="{% url "contact" %}">Contact</a></li>
        <li><a href="{% url "logout" %}">Logout</a></li>
      {% else %}
        
        <li><a href="{% url "contact" %}">Contact</a></li>
        <li><a href="{% url "login" %}">Login</a></li>
      {% endif %}
     <!-- Show emoji/avatar if logged in -->
  
  </ul>
</div>
