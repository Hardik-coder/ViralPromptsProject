{% extends "base.html" %}
{% load static %}
{% block title %}Login{% endblock title %}
{% block style %}
<link rel="stylesheet" href="{% static 'css/login-style.css' %}">
{% endblock style %}
{% block content %}
<div class="login-container">
  <h2 class="login-title">Set a new password</h2>
  
  <form class="login-form" method="post">
    {% csrf_token %}
    
      {% if form.errors %}
     
<div class="alert alert-danger alert-dismissible fade show custom-error" role="alert">
  ⚠️ {{form.errors}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

</div>

{% endif %}
<div class="form-group">
      <label for="username">New Password</label>
      <input type="password"
    name="{{ form.new_password1.name }}"
    value="{{ form.new_password1.value}}"
    placeholder="Set new password"
    required>
</div>
    <div class="form-group">
    <label for="username">Confirm New Password</label>
      <input type="password"
    name="{{ form.new_password2.name }}"
    value="{{ form.new_password2.value}}"
    placeholder="Confirm new password"
    required>
    </div>


    <button type="submit" class="login-btn">Set new password</button>
  </form>

  <!-- Google Login Block -->
  
</div>
{% endblock content %}
