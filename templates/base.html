{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock title %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/style3.css' %}">
  <link rel="stylesheet" href="{% static 'css/navbar-style.css' %}">
  {% block style %}{% endblock style %}
</head>
<body>
{% include "navbar.html" %}
<div class="container py-5">
{% block content %}{% endblock content %}
</div>
<!-- footer -->
<!-- Footer -->
{% include "footer-base.html" %}
<!-- JS -->
<script>
 // Clear button functionality
  document.querySelector('.clear-btn').addEventListener('click', () => {
    const input = document.getElementById('searchInput');
    input.value = "";              // clear the text
    input.focus();                 // optional: put cursor back in the box
  });

const toggle = document.getElementById('navbar-toggle');
const card = document.getElementById('navbar-card');

toggle.addEventListener('click', () => {
  card.classList.toggle('active');  // toggles open/close
});


</script>
<!-- Bootstrap JS Bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
