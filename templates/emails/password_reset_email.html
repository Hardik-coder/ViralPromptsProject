<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
  <style>
    body {
      background: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f4ff;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 600px;
      margin: 40px auto;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(124,124,255,0.4);
      padding: 30px;
      text-align: center;
    }
    h2 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c7cff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(124,124,255,0.6);
      margin-bottom: 20px;
    }
    p {
      font-size: 1rem;
      color: #cbd5f5;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(168,85,247,0.6);
      transition: all 0.3s ease;
    }
    .btn:hover {
      box-shadow: 0 0 18px rgba(168,85,247,0.8);
    }
    .footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <h2>Password Reset Request</h2>
    <p>We received a request to reset your password. Click the button below to set a new one.</p>
    <a
      href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
      
    >
      Reset Password
    </a>
    <p>If you didn’t request this, you can safely ignore this email.</p>
    <div class="footer">
      &copy; 2026 ViralPrompts. All rights reserved.
    </div>
  </div>
</body>
</html>
